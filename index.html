<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Portal | Community Verified Access</title>
    <meta property="og:site_name" content="Portal Media USA">
    <meta property="og:title" content="Shared Community Content - Secure Access">
    <meta property="og:description" content="View shared media via secure cloud delivery. High-speed streaming enabled for verified regions.">
    <meta property="og:image" content="https://vidley.pw/tombolplay.jpg">
    <meta property="og:type" content="website">
    <meta name="description" content="Watch trending community shared videos through secure cloud streaming access.">
    <meta name="robots" content="index,follow">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        
        * {
            box-sizing: border-box;
        }
        
        body {
            background: #050505;
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(20, 20, 22, .95);
            border: 1px solid rgba(255, 255, 255, .08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .8);
        }
        
        .video-container {
            width: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            max-height: 70vh;
        }
        
        video {
            width: 100%;
            height: 100%;
            max-height: 70vh;
            object-fit: contain;
        }
        
        .ad-slot {
            width: 320px;
            height: 50px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .native-wrapper {
            width: 100%;
            max-width: 900px;
            margin: auto;
            overflow: hidden;
            border-radius: 12px;
            background: rgba(255, 255, 255, .02);
            border: 1px solid rgba(255, 255, 255, .05);
            padding: 12px;
        }
        
        .native-wrapper iframe {
            max-width: 100% !important;
        }
        
        .sponsor-label {
            text-align: center;
            font-size: 11px;
            color: #777;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        ::-webkit-scrollbar {
            width: 0;
        }
        
        @media (max-width: 768px) {
            .ad-slot {
                width: 320px;
                max-width: 100%;
            }
            .native-wrapper {
                padding: 8px;
            }
        }
    </style>
    
</head>
<body class="flex items-center justify-center p-3 md:p-6">
    <div class="w-full max-w-2xl glass-card rounded-2xl overflow-hidden">
        <!-- VIDEO -->
        <div id="videoArea" class="video-container relative">
            <video id="mainPlayer" controls playsinline preload="metadata">
                Your browser does not support the video tag.
            </video>
            <div id="errorMsg" class="hidden absolute inset-0 bg-black flex items-center justify-center">
                <i data-lucide="video-off" class="w-10 h-10 text-gray-600"></i>
            </div>
        </div>
        
        <!-- CONTENT -->
        <div class="p-6 sm:p-8 bg-gradient-to-b from-[#0a0a0c] to-[#050505]">
            <!-- CTA -->
            <div class="flex justify-center">
                <a href="https://www.facebook.com/groups/1646509056316964" target="_blank" rel="noopener noreferrer" class="group flex items-center gap-3 px-8 py-3.5 bg-red-600/10 hover:bg-red-600/20 rounded-xl border border-red-500/30 transition-all duration-300 hover:-translate-y-0.5">
                    <i data-lucide="flame" class="w-5 h-5 text-red-500 group-hover:scale-110 transition-transform"></i>
                    <span class="text-sm font-black tracking-[0.2em] text-red-500 uppercase">Trending X Video</span>
                </a>
            </div>
            
            <!-- NATIVE ADS -->
            <div class="native-wrapper mt-8">
                <div class="sponsor-label">Sponsored Content</div>
                <script async="async" data-cfasync="false" src="https://brillianceradiant.com/54f40a4ce292a9187e0b9a0feb507f92/invoke.js"></script>
                <div id="container-54f40a4ce292a9187e0b9a0feb507f92"></div>
            </div>
            
            <!-- BANNER 320x50 -->
            <div class="ad-slot mt-6">
                <script type="text/javascript">
                    atOptions = {
                        'key': '40f6d8e53b94841ddceb2cbf7ae47723',
                        'format': 'iframe',
                        'height': 50,
                        'width': 320,
                        'params': {}
                    };
                    document.write('<script type="text/javascript" src="https://brillianceradiant.com/40f6d8e53b94841ddceb2cbf7ae47723/invoke.js"><\/script>');
                </script>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            
            let videoId = window.location.pathname.split('/').pop().trim();
            if (videoId === "index.html" || videoId === "bridge.html" || videoId === "") {
                videoId = "";
            }
            
            const mainPlayer = document.getElementById("mainPlayer");
            const errorMsg = document.getElementById("errorMsg");
            
            if (/^[a-zA-Z0-9_.-]{3,80}$/.test(videoId) && videoId !== "") {
                const filename = videoId.includes('.') ? videoId : videoId + '.mp4';
                const videoUrl = 'https://cdn2.videy.co/' + encodeURIComponent(filename);
                mainPlayer.src = videoUrl;
                
                mainPlayer.addEventListener('error', () => {
                    mainPlayer.classList.add('hidden');
                    errorMsg.classList.remove('hidden');
                });
            } else {
                mainPlayer.classList.add('hidden');
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
    
    <!-- HISTATS -->

        })();
    </script>
</body>
</html>
